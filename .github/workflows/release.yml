name: Release

# Triggered when a v* tag is pushed (e.g., `git tag v0.1.0 && git push --tags`),
# or manually via workflow_dispatch with an explicit tag (for backfills).
#
# Steps: create GitHub release → compute tarball SHA256 → open + auto-merge
# a formula-bump PR against vihang/homebrew-tap (requires TAP_PAT secret).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.1.2'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "Tag '$TAG' is not vX.Y.Z (or vX.Y.Z-prerelease). Did you forget the 'v' prefix?" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          # Read VERSION from the tagged commit, not the checked-out ref —
          # on workflow_dispatch backfills we check out the dispatch branch
          # (typically main) so the bump step uses main's Formula template
          # (the source of truth), but the verify still needs the tag's
          # VERSION to fail loudly on a tag/file mismatch.
          file_ver="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/VERSION" | tr -d '[:space:]')"
          if [ "$tag" != "$file_ver" ]; then
            echo "Tag v$tag does not match VERSION file at ${TAG} ($file_ver)" >&2
            exit 1
          fi

      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
          else
            gh release create "$TAG" \
              --title "yaamux $TAG" \
              --generate-notes
          fi

      - name: Compute tarball SHA256
        id: sha
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$url" -o release.tar.gz
          sha="$(sha256sum release.tar.gz | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Tarball SHA256: $sha"

      - name: Bump Homebrew tap formula
        if: ${{ env.TAP_PAT != '' }}
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TAP_PAT}@github.com/vihang/homebrew-tap.git" tap
          cd tap
          git config user.email "release-bot@yaamux"
          git config user.name  "yaamux-release-bot"

          branch="bump-yaamux-${TAG}"

          # Copy the full formula template from source and patch in the
          # tagged URL + computed SHA.
          apply_formula() {
            cp "$GITHUB_WORKSPACE/Formula/yaamux.rb" Formula/yaamux.rb
            sed -i.bak \
              -e "s|^  url \".*\"|  url \"https://github.com/vihang/yaamux/archive/refs/tags/${TAG}.tar.gz\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
              Formula/yaamux.rb
            rm Formula/yaamux.rb.bak
          }

          # Short-circuit: if main is already at the target tag, there's
          # nothing to bump. Apply on main and check for diff.
          apply_formula
          if git diff --quiet -- Formula/yaamux.rb; then
            echo "Formula already up to date on main for ${TAG}; nothing to bump."
            # Clean up a stale bump branch left by a prior failed run.
            if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
              echo "Deleting stale ${branch} branch on origin."
              git push origin --delete "$branch"
            fi
            exit 0
          fi
          # Reset the working tree before switching branches.
          git checkout -- Formula/yaamux.rb

          # Switch to the bump branch (resetting from origin if a prior run
          # left it behind), then re-apply.
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi

          apply_formula

          if ! git diff --quiet -- Formula/yaamux.rb; then
            git commit -am "yaamux: ${TAG}"
            git push -u origin "$branch"
          fi

          # Ensure an OPEN PR exists for this branch (closed PRs from prior
          # failed runs shouldn't be picked up for merge — `gh pr view <branch>`
          # would happily return a closed PR, so use `gh pr list --state open`).
          open_pr_count="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
          if [ "$open_pr_count" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "yaamux: ${TAG}" \
              --body "Auto-bump from release ${TAG}. Tarball SHA256: \`${SHA}\`."
          fi

          # Merge the PR. Use --auto only when auto-merge is actually enabled
          # on the repo (so a transient `gh pr merge --auto` failure can't
          # silently fall back to a protection-bypassing immediate merge).
          # `gh repo view --json autoMergeAllowed` is unsupported; the REST
          # `repos/{owner}/{repo}` payload exposes the same flag as
          # `allow_auto_merge`.
          auto_allowed="$(gh api repos/vihang/homebrew-tap --jq .allow_auto_merge)"
          if [ "$auto_allowed" = "true" ]; then
            gh pr merge "$branch" --squash --delete-branch --auto
          else
            gh pr merge "$branch" --squash --delete-branch
          fi
