name: Release

# Triggered when a v* tag is pushed (e.g., `git tag v0.1.0 && git push --tags`),
# or manually via workflow_dispatch with an explicit tag (for backfills).
#
# Steps: create GitHub release → compute tarball SHA256 → open + auto-merge
# a formula-bump PR against vihang/homebrew-tap (requires TAP_PAT secret).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.1.2'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "Tag '$TAG' is not vX.Y.Z (or vX.Y.Z-prerelease). Did you forget the 'v' prefix?" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          file_ver="$(cat VERSION)"
          if [ "$tag" != "$file_ver" ]; then
            echo "Tag v$tag does not match VERSION file ($file_ver)" >&2
            exit 1
          fi

      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
          else
            gh release create "$TAG" \
              --title "yaamux $TAG" \
              --generate-notes
          fi

      - name: Compute tarball SHA256
        id: sha
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$url" -o release.tar.gz
          sha="$(sha256sum release.tar.gz | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Tarball SHA256: $sha"

      - name: Bump Homebrew tap formula
        if: ${{ env.TAP_PAT != '' }}
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TAP_PAT}@github.com/vihang/homebrew-tap.git" tap
          cd tap
          git config user.email "release-bot@yaamux"
          git config user.name  "yaamux-release-bot"

          branch="bump-yaamux-${TAG}"

          # Copy the full formula template from source and patch in the
          # tagged URL + computed SHA. Centralised so the two call sites
          # below can't drift.
          apply_formula() {
            cp "$GITHUB_WORKSPACE/Formula/yaamux.rb" Formula/yaamux.rb
            sed -i.bak \
              -e "s|^  url \".*\"|  url \"https://github.com/vihang/yaamux/archive/refs/tags/${TAG}.tar.gz\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
              Formula/yaamux.rb
            rm Formula/yaamux.rb.bak
          }

          # Switch to the bump branch FIRST (resetting from origin if a prior
          # failed run left it behind), so apply_formula's working-tree edits
          # can't collide with a later checkout.
          if git ls-remote --exit-code origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi

          apply_formula

          if ! git diff --quiet -- Formula/yaamux.rb; then
            git commit -am "yaamux: ${TAG}"
            git push -u origin "$branch"
          fi

          # Open the PR if it doesn't exist yet.
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            # Nothing to PR if the bump branch has no commits ahead of main
            # (i.e. the formula on main was already at this tag — e.g.
            # backfilled by hand). Exit cleanly.
            if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
              echo "Formula already up to date on main for ${TAG}; nothing to PR."
              exit 0
            fi
            gh pr create \
              --base main \
              --head "$branch" \
              --title "yaamux: ${TAG}" \
              --body "Auto-bump from release ${TAG}. Tarball SHA256: \`${SHA}\`."
          fi

          # Merge the PR. Use --auto only when auto-merge is actually enabled
          # on the repo (so a transient `gh pr merge --auto` failure can't
          # silently fall back to a protection-bypassing immediate merge).
          auto_allowed="$(gh repo view --json autoMergeAllowed --jq .autoMergeAllowed)"
          if [ "$auto_allowed" = "true" ]; then
            gh pr merge "$branch" --squash --delete-branch --auto
          else
            gh pr merge "$branch" --squash --delete-branch
          fi
